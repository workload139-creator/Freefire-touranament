<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Player Account</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">🏆 FF TOURNAMENT</div>

    <nav>
        <a href="{{ url_for('index') }}">🏠 Home</a>
        <a href="{{ url_for('auth.player_login') }}">🔐 Login</a>
    </nav>
</header>

<section class="section">

<div class="card">

<h1>📝 Create Player Account</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="status {{ category }}">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('auth.player_register') }}">

<label>Player Name</label>
<input
    type="text"
    name="player_name"
    placeholder="Enter player name"
    required
>

<label>Free Fire UID</label>
<input
    type="text"
    name="ff_uid"
    placeholder="Enter Free Fire UID"
    required
>

<label>Email</label>
<input
    type="email"
    name="email"
    placeholder="Enter email address"
    required
>

<label>Password</label>
<input
    type="password"
    name="password"
    placeholder="Minimum 8 characters"
    minlength="8"
    required
>

<label>Confirm Password</label>
<input
    type="password"
    name="confirm_password"
    placeholder="Confirm password"
    minlength="8"
    required
>

<button class="btn" type="submit">
    🚀 Create Account
</button>

</form>

<p>
Already have an account?
<a href="{{ url_for('auth.player_login') }}">Login</a>
</p>

</div>

</section>

<footer>
<p>Independent community tournament platform.</p>
</footer>

</body>
</html>
