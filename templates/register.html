<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Team</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        🎮 FF TOURNAMENT
    </div>

    <nav>
        <a href="/">Home</a>
    </nav>

</header>


<section class="form-section">

    <h1>📝 Tournament Registration</h1>

    <h2>{{ tournament["name"] }}</h2>

    <form
        method="POST"
        class="main-form">

        <label>
            Player Name
        </label>

        <input
            type="text"
            name="player_name"
            placeholder="Enter player name"
            required>


        <label>
            Team Name
        </label>

        <input
            type="text"
            name="team_name"
            placeholder="Enter team name"
            required>


        <label>
            Free Fire UID
        </label>

        <input
            type="text"
            name="uid"
            placeholder="Enter UID"
            required>


        <button type="submit">
            Submit Registration
        </button>

    </form>

</section>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
