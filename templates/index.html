<section class="section" id="tournaments">
    <h2>🏆 Available Tournaments</h2>

    <div class="tournament-grid">

        {% for t in tournaments %}

        <div class="card tournament-card">

            <a href="{{ url_for('tournament', tournament_id=t[0]) }}"
               class="card-link">

                <h3>🎮 {{ t[1] }}</h3>

                <p>🎮 Mode: {{ t[2] }}</p>

                <p>💰 Entry: {{ t[3] }}</p>

                <p>🏆 Prize: {{ t[4] }}</p>

                <p>📅 Date: {{ t[5] }}</p>

                <p class="status">
                    🔵 {{ t[6] }}
                </p>

            </a>

            <a href="{{ url_for('register', tournament_id=t[0]) }}"
               class="btn register-btn">
                📝 Register Now
            </a>

        </div>

        {% else %}

        <div class="card">
            <h3>😔 No tournaments available</h3>
            <p>New tournaments will appear here.</p>
        </div>

        {% endfor %}

    </div>
</section>
