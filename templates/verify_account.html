<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Account</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
<div class="logo">🏆 FF TOURNAMENT</div>
<nav>
<a href="{{ url_for('index') }}">🏠 Home</a>
</nav>
</header>

<section class="section">

<div class="card">

<h1>🔐 Verify Account</h1>

<p>
Email:
<strong>{{ email }}</strong>
</p>

<p>
OTP 10 minutes के लिए valid है।
</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="status {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}

<form
method="POST"
action="{{ url_for('auth.verify_account') }}"
>

<label>Email OTP</label>

<input
type="text"
name="email_otp"
inputmode="numeric"
maxlength="6"
>

<label>Phone OTP</label>

<input
type="text"
name="phone_otp"
inputmode="numeric"
maxlength="6"
>

<button class="btn" type="submit">
✅ Verify Account
</button>

</form>

<form
method="POST"
action="{{ url_for('auth.resend_otp') }}"
>

<button class="btn" type="submit">
🔄 Resend OTP
</button>

</form>

</div>

</section>

<footer>
<p>Independent community tournament platform.</p>
</footer>

</body>
</html>
