<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <a href="{{ url_for('index') }}">🏠 Home</a>
    <a href="{{ url_for('leaderboard') }}">🏆 Leaderboard</a>
    <a href="{{ url_for('player_register') }}">📝 Create Account</a>
</nav>

<div class="container">

    <h1>🔐 Player Login</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>Email / FF UID / Phone</label>

        <input
            type="text"
            name="login"
            placeholder="Enter Email, UID or Phone"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <p>
        New Player?
        <a href="{{ url_for('player_register') }}">
            Create Account
        </a>
    </p>

</div>

</body>
</html>
