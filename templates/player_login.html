<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
<div class="logo">🏆 FF TOURNAMENT</div>

<nav>
<a href="{{ url_for('index') }}">🏠 Home</a>
<a href="{{ url_for('auth.player_register') }}">📝 Create Account</a>
</nav>

</header>

<section class="section">

<div class="card">

<h1>🔐 Player Login</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="status {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}

<form
method="POST"
action="{{ url_for('auth.player_login') }}"
>

<label>UID / Email / Phone</label>

<input
type="text"
name="login"
required
>

<label>Password</label>

<input
type="password"
name="password"
required
>

<button class="btn" type="submit">
🔑 Login
</button>

</form>

<p>
New player?
<a href="{{ url_for('auth.player_register') }}">
Create Account
</a>
</p>

</div>

</section>

<footer>
<p>Independent community tournament platform.</p>
</footer>

</body>
</html>
