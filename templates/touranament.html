<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ tournament["name"] }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        🎮 FF TOURNAMENT
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/leaderboard">Leaderboard</a>
    </nav>

</header>


<section class="details">

    <h1>{{ tournament["name"] }}</h1>

    <div class="detail-card">

        <p>
            🎮 <strong>Mode:</strong>
            {{ tournament["mode"] }}
        </p>

        <p>
            💰 <strong>Entry:</strong>
            {{ tournament["entry"] }}
        </p>

        <p>
            🏆 <strong>Prize:</strong>
            {{ tournament["prize"] }}
        </p>

        <p>
            📅 <strong>Date:</strong>
            {{ tournament["date"] }}
        </p>

        <p>
            🔵 <strong>Status:</strong>
            {{ tournament["status"] }}
        </p>

        <a
            href="/register/{{ tournament['id'] }}"
            class="btn">

            Register Now

        </a>

    </div>

</section>


<footer>
    <p>© 2026 FF Tournament</p>
</footer>


<script src="{{ url_for('static', filename='script.js') }}">
</script>
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</body>

</html>
